  app:
    build:
      context: ./App
    container_name: app
    restart: always
    expose:
      - "9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=9876
    labels:
      - "traefik.enable=true"

      - "traefik.docker.network=proxy"
      # ===== Router utama (semua traffic) =====
      - "traefik.http.routers.app.rule=Host(`ashanum.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=myresolver"
      - "traefik.http.services.app.loadbalancer.server.port=9876"

      # ===== Router khusus /xadmin (dengan basicAuth) =====
      - "traefik.http.routers.app-admin.rule=Host(`ashanum.com`) && PathPrefix(`/xadmin`)"
      - "traefik.http.routers.app-admin.entrypoints=websecure"
      - "traefik.http.routers.app-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.app-admin.middlewares=admin-auth"
      - "traefik.http.routers.app.priority=1"
      - "traefik.http.routers.app-admin.priority=10"
      # ===== Middleware basicAuth =====
      # Ganti dengan hasil generate dari: htpasswd -nb admin
      # - "traefik.http.middlewares.admin-auth.basicauth.users=ikbaly94@gmail.com:$$apr1$$lS7k93kv$$bvtNhoysA5X/S57v2nIH2."
      - "traefik.http.middlewares.admin-auth.basicauth.users=ikbaly94@gmail.com:$$apr1$$lS7k93kv$$bvtNhoysA5X/S57v2nIH2."

    networks:
      - proxy
    volumes:
      - ./App/uploads:/usr/src/app/uploads

  # Bot WhatsApp English Companion (lihat englishbot/README.md).
  # Isi di .env server (folder WaBot): EB_OWNER_NUMBER, EB_ADMIN_TOKEN, opsional EB_OWNER_NAME.
  # Login: http://SERVER:3100/qr?token=EB_ADMIN_TOKEN (sekali; sesi disimpan di volume englishbot_data).
  englishbot:
    build:
      context: ./englishbot
    container_name: englishbot
    restart: unless-stopped
    environment:
      - OWNER_NUMBER=${EB_OWNER_NUMBER:-}
      - OWNER_NAME=${EB_OWNER_NAME:-Ikbal}
      - ADMIN_TOKEN=${EB_ADMIN_TOKEN:-}
      - PORT=3100
      - APP_BASE_URL=https://ikbalyuliyanto.github.io/english-90-hari/
      - WORKER_BASE_URL=https://english-90-hari-push.ikbaly94.workers.dev
      - REVIEW_MAX_DAY=${EB_REVIEW_MAX_DAY:-20}
      - REMINDER_INTERVAL_MIN=15
      - COOLDOWN_MIN=10
      - WA_WEB_VERSION=${EB_WA_WEB_VERSION:-}
      - TZ=Asia/Jakarta
    ports:
      - "3100:3100"
    volumes:
      - englishbot_data:/app/data
    shm_size: "512mb"

networks:
  proxy:
    external: true

volumes:
  englishbot_data:
    
